---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: dnf
    repos:
      files:
        - 1password.repo
        - antigravity.repo
        - brave-browser.repo
        - cursor.repo
        - google-chrome.repo
        # - sublime-text.repo # waiting Sublime repo fix: https://github.com/sublimehq/sublime_text/issues/6669
        - windsurf.repo
      keys:
        - https://download.sublimetext.com/sublimehq-pub.gpg
    install:
      packages:
        - 1password
        - antigravity
        - blueprint-compiler
        - brave-browser
        - chatwise.rpm
        - cursor
        - dropbox-v2025.05.20-f43.rpm
        - firefox
        - g++
        - gnome-system-monitor
        - google-chrome-stable
        - gtk4-devel
        - gtk4-layer-shell-devel
        - libadwaita-devel
        - papirus-icon-theme
        - python3-gpg
        - windsurf
        # - sublime-merge # repo package
        # - sublime-text # repo package
        # - https://download.sublimetext.com/sublime-merge-2112-1.x86_64.rpm
        # - https://download.sublimetext.com/sublime-text-4200-1.x86_64.rpm
    remove:
      packages:
        - Sunshine
      auto-remove: true
  - from-file: _chatwise-desktop-fix.yml
