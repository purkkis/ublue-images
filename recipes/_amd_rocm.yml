---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: dnf
    repos:
      nonfree: negativo17
    install:
      packages:
        # Linux firmware (F42: already included in base image):
        - linux-firmware
        - amd-gpu-firmware
        # MESA (F42: already included in base image):
        - mesa-vulkan-drivers
        - mesa-dri-drivers
        - mesa-libGL
        # Codecs:
        - mesa-va-drivers
        - mesa-vdpau-drivers
        # RPMFusion codecs:
        # - mesa-va-drivers-freeworld
        # - mesa-vdpau-drivers-freeworld
        # ROCm:
        - rocm
        - rocminfo
        - rocm-smi
