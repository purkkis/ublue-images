---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  # - type: dnf
  #   repos:
  #     nonfree: rpmfusion
  - type: dnf
    install:
      packages:
        - https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-%OS_VERSION%.noarch.rpm
        - https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-%OS_VERSION%.noarch.rpm
  - type: dnf
    install:
      packages:
        # Steam
        - steam
        # Linux firmware (F42: already included in base image):
        - linux-firmware
        - amd-gpu-firmware
        # MESA (F42: already included in base image):
        - mesa-vulkan-drivers
        - mesa-dri-drivers
        - mesa-libGL
        # Codecs:
        # - mesa-va-drivers
        # - mesa-vdpau-drivers
        # RPMFusion codecs:
        # - mesa-va-drivers-freeworld
        # - mesa-vdpau-drivers-freeworld
        # ROCm:
        - rocm
        - rocminfo
        - rocm-smi
    replace:
      - from-repo: rpmfusion-free
        packages:
          - old: mesa-va-drivers
            new: mesa-va-drivers-freeworld
          - old: mesa-vdpau-drivers
            new: mesa-vdpau-drivers-freeworld
          - old: mesa-va-drivers.i686
            new: mesa-va-drivers-freeworld.i686
          - old: mesa-vdpau-drivers.i686
            new: mesa-vdpau-drivers-freeworld.i686
