---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: files
    files:
      # Configure users for 1Password
      - source: usr_lib_sysusers_d
        destination: /usr/lib/sysusers.d
      # Setup Brave management policies
      - source: etc_brave_policies_managed
        destination: /etc/brave/policies/managed
      # ChatGPT RPM repo signing key (gpgkey=file:///etc/pki/rpm-gpg/...)
      # Extracted from Docker container after the chatgpt.rpm was installed:
      # 'docker cp <container-id>:/etc/pki/rpm-gpg/RPM-GPG-KEY-chatgpt ./files/dnf/RPM-GPG-KEY-chatgpt'
      # - source: etc_pki_rpm_gpg
      #   destination: /etc/pki/rpm-gpg
  - type: script
    snippets:
      - systemd-sysusers
