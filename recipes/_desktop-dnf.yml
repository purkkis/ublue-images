---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  # RPMs from package repos:
  - type: dnf
    repos:
      files:
        - 1password.repo
        - brave-browser.repo
        - chatgpt.repo
        - devin-desktop.repo
        - cursor.repo
        - google-chrome.repo
        - tailscale.repo
        - sublime-text.repo
        - vivaldi.repo
        - vscode.repo
      copr:
        - imput/helium
        - cboxdoerfer/fsearch
    install:
      packages:
        # Copr
        - fsearch
        - helium

        # 3rd party repos
        - 1password
        - 1password-cli
        - chatgpt
        - code
        - devin-desktop
        - google-chrome-stable
        - cursor
        - brave-browser
        - sublime-merge
        - sublime-text
        - tailscale
        - vivaldi-stable

        # Fedora repos
        - akregator
        - clang
        - default-fonts-cjk
        - default-fonts-core
        - distrobox
        - firefox
        - flatpak-builder
        - fuse
        - fuse-libs
        - g++
        - gcc-gfortran
        - git
        - gnome-system-monitor
        - gparted
        - gwenview
        - gtk3-devel
        - hplip-gui
        - ImageMagick-heic
        - iotop
        - javascriptcoregtk4.1
        - lm_sensors
        - nethogs
        - okular
        - papirus-icon-theme
        - podman
        - steam
        - vlc
        - webkit2gtk4.1
        - zsh

        # Ghostty
        - libadwaita-devel
        - gtk4-devel
        - gtk4-layer-shell-devel
        - gettext
        - blueprint-compiler

        # RPMs
        - direct_downloads/chatwise.rpm
        - github_releases/protonmail-bridge.rpm
        - github_releases/dbeaver.rpm
        - github_releases/termy.rpm
        - github_releases/vscodium.rpm
        - github_releases/firefoxpwa.rpm
        - github_releases/openknowledge.rpm
  - type: systemd
    system:
      enabled:
        - tailscaled.service
