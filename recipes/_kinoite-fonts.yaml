---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: fonts
    fonts:
      nerd-fonts:
        - FiraCode
        - Hack
        - SourceCodePro
        - Terminus
        - JetBrainsMono
        - Monaspace
      google-fonts:
        - Google Sans Code
  - type: script
    snippets:
      - wget -O /usr/share/fonts/google-noto-color-emoji-fonts/NotoColorEmoji-CBDT.ttf
        https://github.com/googlefonts/noto-emoji/raw/main/fonts/NotoColorEmoji.ttf
      - fc-cache -f -v
