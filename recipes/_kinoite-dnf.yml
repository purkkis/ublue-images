---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  # RPMs from package repos:
  - type: dnf
    repos:
      files:
        - 1password.repo
        - brave-browser.repo
        - cursor.repo
        - tailscale.repo
        - sublime-text.repo
        - vivaldi.repo
        - vscode.repo
    install:
      packages:
        - 1password
        - 1password-cli
        - blueprint-compiler
        - brave-browser
        - code
        - cursor
        - distrobox
        - firefox
        - fuse
        - fuse-libs
        - g++
        - gettext # for building Ghostty
        - git
        - gnome-common
        - gnome-system-monitor
        - google-noto-emoji-color-fonts
        - google-noto-sans-cjk-fonts
        - google-noto-sans-fonts
        - google-noto-serif-fonts
        - gparted
        - gwenview
        - gtk4-devel # for building Ghostty
        - gtk4-layer-shell-devel # for building Ghostty
        - hplip-gui
        - libadwaita-devel # for building Ghostty
        - okular
        - papirus-icon-theme
        - podman
        - steam
        - sublime-merge
        - sublime-text
        - tailscale
        - vivaldi-stable
        - vlc
        - zsh
  # Manually downloaded RPMs:
  - type: dnf
    install:
      packages:
        - rpms/protonmail-bridge.rpm
        - rpms/chatwise.rpm
        - rpms/positron.rpm
        - tags/dbeaver.rpm
  - type: systemd
    system:
      enabled:
        - tailscaled.service
