---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  # RPMs from package repos:
  - type: dnf
    repos:
      files:
        - 1password.repo
        - antigravity.repo
        - brave-browser.repo
        - cursor.repo
        - google-chrome.repo
        - tailscale.repo
        # - sublime-text.repo # waiting Sublime repo fix: https://github.com/sublimehq/sublime_text/issues/6669
        - vivaldi.repo
        - vscode.repo
        - windsurf.repo
    install:
      packages:
        - 1password
        - 1password-cli
        - antigravity
        - blueprint-compiler
        - brave-browser
        - code
        - cursor
        - distrobox
        - firefox
        - g++
        - gnome-common
        - gnome-system-monitor
        - google-chrome-stable
        - google-noto-emoji-color-fonts
        - google-noto-sans-cjk-fonts
        - google-noto-sans-fonts
        - google-noto-serif-fonts
        - gparted
        - gtk4-devel
        - gtk4-layer-shell-devel
        - hplip-gui
        - libadwaita-devel
        - papirus-icon-theme
        - podman
        - python3-gpg
        - steam
        # - sublime-merge
        # - sublime-text
        - tailscale
        - vivaldi-stable
        - windsurf
        - zsh
  # Manually downloaded RPMs:
  - type: dnf
    install:
      packages:
        - dropbox-v2025.05.20-f43.rpm
        - rpms/bitwarden.rpm
        - rpms/positron.rpm
        - rpms/protonmail-bridge.rpm
        - rpms/proton-pass.rpm
        - tags/chatwise.rpm
        - tags/dbeaver.rpm
        - tags/opencode.rpm
        - tags/winboat.rpm
  - from-file: _scripts.yml
  - type: systemd
    system:
      enabled:
        - tailscaled.service
