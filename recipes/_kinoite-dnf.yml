---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: dnf
    repos:
      files:
        - 1password.repo
        - antigravity.repo
        - brave-browser.repo
        - cursor.repo
        - google-chrome.repo
        - tailscale.repo
        - sublime-text.repo # waiting Sublime repo fix: https://github.com/sublimehq/sublime_text/issues/6669
        - vscode.repo
        - windsurf.repo
    install:
      packages:
        - 1password
        - 1password-cli
        - antigravity
        - blueprint-compiler
        - brave-browser
        - chatwise.rpm
        - code
        - cursor
        - dbeaver.rpm
        - distrobox
        - dropbox-v2025.05.20-f42.rpm
        - firefox
        - g++
        - gnome-system-monitor
        - google-chrome-stable
        - google-noto-emoji-color-fonts
        - google-noto-sans-cjk-fonts
        - google-noto-sans-fonts
        - google-noto-serif-fonts
        - gparted
        - gtk4-devel
        - gtk4-layer-shell-devel
        - libadwaita-devel
        - papirus-icon-theme
        - podman
        - https://cdn.posit.co/positron/releases/rpm/x86_64/Positron-2025.12.1-4-x64.rpm # package: positron
        - https://proton.me/download/bridge/protonmail-bridge-3.21.2-1.x86_64.rpm # package: protonmail-bridge
        - python3-gpg
        - steam
        - sublime-merge
        - sublime-text
        - tailscale
        - windsurf
        - zsh
  - from-file: _chatwise-desktop-fix.yml
  - type: systemd
    system:
      enabled:
        - tailscaled.service
