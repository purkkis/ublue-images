---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  # RPMs from package repos:
  - type: dnf
    repos:
      files:
        - 1password.repo
        # - antigravity.repo
        - brave-browser.repo
        # - cursor.repo
        # - google-chrome.repo
        - tailscale.repo
        # - sublime-text.repo # waiting for Sublime's Fedora 43 repo fix: https://github.com/sublimehq/sublime_text/issues/6669
        # - vivaldi.repo
        - vscode.repo
        - windsurf.repo
    install:
      packages:
        - 1password
        - 1password-cli
        # - antigravity
        - blueprint-compiler
        - brave-browser
        - code
        # - cursor
        - distrobox
        - firefox
        - g++
        - gnome-common
        - gnome-system-monitor
        # - google-chrome-stable
        - google-noto-emoji-color-fonts
        - google-noto-sans-cjk-fonts
        - google-noto-sans-fonts
        - google-noto-serif-fonts
        - gparted
        - gwenview
        - gtk4-devel
        - gtk4-layer-shell-devel
        - hplip-gui
        - libadwaita-devel
        - okular
        - papirus-icon-theme
        - podman
        - python3-gpg
        # - sublime-merge
        # - sublime-text
        - tailscale
        - thunderbird
        # - vivaldi-stable
        - windsurf
        - zsh
    group-install:
      packages:
        - development-tools
  # Manually downloaded RPMs:
  - type: dnf
    install:
      packages:
        - dropbox-f43.rpm
        # - rpms/positron.rpm
        - rpms/protonmail-bridge.rpm
        - tags/chatwise.rpm
        - tags/dbeaver.rpm
        - tags/opencode.rpm
        - tags/winboat.rpm
  - from-file: _scripts.yml # fix desktop files etc.
  - type: systemd
    system:
      enabled:
        - tailscaled.service
