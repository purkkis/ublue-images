---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  # RPMs from package repos:
  - type: dnf
    repos:
      files:
        - 1password.repo
        - brave-browser.repo
        - cursor.repo
        - google-chrome.repo
        - tailscale.repo
        - sublime-text.repo
        - vivaldi.repo
        - vscode.repo
    install:
      packages:
        # 3rd party repos
        - 1password
        - 1password-cli
        - code
        - google-chrome-stable
        - cursor
        - brave-browser
        - sublime-merge
        - sublime-text
        - tailscale
        - vivaldi-stable

        # Fedora repos
        - akonadiconsole
        - akregator
        - clang
        - distrobox
        - firefox
        - fuse
        - fuse-libs
        - g++
        - gcc-gfortran
        - git
        - gnome-system-monitor
        - google-noto-sans-fonts
        - google-noto-serif-fonts
        - google-noto-sans-cjk-fonts
        - google-noto-emoji-color-fonts
        - gparted
        - gwenview
        - gtk3-devel
        - hplip-gui
        - korganizer
        - merkuro
        - okular
        - papirus-icon-theme
        - podman
        - steam
        - vlc
        - zsh

        # Ghostty
        - libadwaita-devel
        - gtk4-devel
        - gtk4-layer-shell-devel
        - gettext
        - blueprint-compiler

        # RPMs
        - direct_downloads/chatwise.rpm
        - github_releases/protonmail-bridge.rpm
        - github_releases/dbeaver.rpm
        - github_releases/opencode.rpm
        - github_releases/drawio.rpm
  - type: systemd
    system:
      enabled:
        - tailscaled.service
