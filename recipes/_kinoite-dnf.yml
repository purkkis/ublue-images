---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  # RPMs from package repos:
  - type: dnf
    repos:
      files:
        - 1password.repo
        - brave-browser.repo
        - cursor.repo
        - google-chrome.repo
        - tailscale.repo
        - sublime-text.repo
        - vivaldi.repo
        - vscode.repo
    install:
      packages:
        - 1password
        - 1password-cli
        - akonadiconsole
        - akregator
        - blueprint-compiler
        - brave-browser
        - clang
        - code
        - google-chrome-stable
        - cursor
        - distrobox
        - firefox
        - fuse
        - fuse-libs
        - g++
        - gcc-gfortran
        - gettext # for building Ghostty
        - git
        - gnome-system-monitor
        - google-noto-fonts-all-static
        - gparted
        - gwenview
        - gtk3-devel
        - gtk4-devel # for building Ghostty
        - gtk4-layer-shell-devel # for building Ghostty
        - hplip-gui
        - korganizer
        - libadwaita-devel # for building Ghostty
        - merkuro
        - okular
        - papirus-icon-theme
        - podman
        - R
        - steam
        - sublime-merge
        - sublime-text
        - tailscale
        - vivaldi-stable
        - vlc
        - zsh
  # Manually downloaded RPMs:
  - type: dnf
    install:
      packages:
        - direct_downloads/chatwise.rpm
        - direct_downloads/positron.rpm
        - github_releases/protonmail-bridge.rpm
        - github_releases/dbeaver.rpm
        - github_releases/opencode.rpm
        - github_releases/dbvr.rpm
        - github_releases/drawio.rpm
        - github_releases/quarto.rpm
  - type: systemd
    system:
      enabled:
        - tailscaled.service
