name: bluebuild

on:
  schedule:
    - cron: "0 09 * * 5" # 09:00 UTC every Friday
  workflow_dispatch: # allow manually triggering builds

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  UV_LINK_MODE: "copy"
  UV_LOCKED: true

jobs:
  # Update tags.json, push new commit if there are changes.
  update-tags:
    name: Update tags.json
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      commit_hash: ${{ steps.auto-commit.outputs.commit_hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      # Update the tags.json file with up-to-date tags from GitHub releases
      - name: Update tags
        run: |
          uv run ublue-images tags refresh

      # Commit the updated tags.json file if it has changed
      - name: Commit updated tags.json
        id: auto-commit
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "Update tags.json"
          file_pattern: src/ublue_images/tags.json

  # Build the images, this checkouts the main branch again in order to get the latest tags.json.
  bluebuild:
    name: Build Custom Image
    needs: update-tags
    runs-on: ubicloud-standard-4
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          - kinoite.yml
          - kinoite-nvidia.yml
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.update-tags.outputs.commit_hash || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-suffix: ${{ matrix.recipe }}

      # Cache the downloaded RPMs based on files.json hash.
      # If the files.json hasn't changed, we restore the files/dnf/rpms folder from cache.
      - name: Cache hardcoded RPMs
        id: rpm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: files/dnf/rpms
          key: rpm-cache-${{ matrix.recipe }}-${{ hashFiles('src/ublue_images/files.json') }}

      # Cache the tagged releases based on tags.json hash.
      # If the tags.json hasn't changed, we restore the files/dnf/tags folder from cache.
      - name: Cache tagged releases
        id: tag-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: files/dnf/tags
          key: tag-cache-${{ matrix.recipe }}-${{ hashFiles('src/ublue_images/tags.json') }}

      # Download hardcoded RPMs only if cache is not hit
      - name: Download hardcoded RPMs
        if: steps.rpm-cache.outputs.cache-hit != 'true'
        run: |
          uv run ublue-images rpms download

      # Download tagged releases only if cache is not hit
      - name: Download tagged releases
        if: steps.tag-cache.outputs.cache-hit != 'true'
        run: |
          uv run ublue-images tags download

      # Build the image
      - name: Build Custom Image
        uses: blue-build/github-action@24d146df25adc2cf579e918efe2d9bff6adea408 # v1.11.1
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          skip_checkout: true
          maximize_build_space: false
          use_cache: false
          # chunkah: true # this feature is not yet released

  # Delete old packages.
  delete-package-versions:
    name: Delete old packages
    needs: bluebuild
    runs-on: ubuntu-latest
    steps:
      # Delete all packages older than 1 day
      - uses: snok/container-retention-policy@d3bdcf5ce9b05f685154e4a16c39233b245e3d53 # v3.1.0
        with:
          account: user
          token: ${{ secrets.PAT }}
          image-names: "*"
          cut-off: 1d
          dry-run: false
