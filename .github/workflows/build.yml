name: bluebuild

on:
  schedule:
    - cron: "0 9 */3 * *" # Every 3 days at 09:00 UTC
  workflow_dispatch: # allow manually triggering builds

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  UV_LINK_MODE: "copy"
  UV_LOCKED: true

jobs:
  # Update releases.json, push new commit if there are changes.
  update-tags:
    name: Update releases.json
    runs-on: ubicloud-standard-2-ubuntu-2404
    permissions:
      contents: write
    outputs:
      commit_hash: ${{ steps.auto-commit.outputs.commit_hash }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      # Update the releases.json file with up-to-date tags from GitHub releases
      - name: Update tags
        run: |
          uv run ublue-images github-releases refresh

      # Commit the updated releases.json file if it has changed
      - name: Commit updated releases.json
        id: auto-commit
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "Update releases.json"
          file_pattern: releases.json

  # Build the images, this checkouts the main branch again in order to get the latest releases.json.
  bluebuild:
    name: Build Custom Image
    needs: update-tags
    runs-on: ubicloud-standard-4-ubuntu-2404
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          - kinoite.yml
          # - kinoite-nvidia.yml
          # - silverblue.yml
          # - silverblue-nvidia.yml
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # https://github.com/stefanzweifel/git-auto-commit-action#outputs
          # 'outputs.commit_hash' is the commit hash of the commit made
          # by the 'stefanzweifel/git-auto-commit-action' action
          ref: ${{ needs.update-tags.outputs.commit_hash || github.sha }}

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-suffix: ${{ matrix.recipe }}

      # hashFiles() hashes whole files; derive section-specific keys from releases.json.
      - name: Create release cache keys
        run: |
          # -c: compact output, -S: sort keys
          jq -cS '.direct_downloads' releases.json > .cache-direct-downloads.json
          jq -cS '.github_releases' releases.json > .cache-github-releases.json

      # Cache downloaded RPMs based on the direct_downloads section hash.
      # If it hasn't changed, restore files/dnf/direct_downloads from cache.
      - name: Cache direct downloads
        id: rpm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: files/dnf/direct_downloads
          key: rpm-cache-${{ matrix.recipe }}-${{ hashFiles('.cache-direct-downloads.json') }}

      # Cache GitHub release RPMs based on the github_releases section hash.
      # If it hasn't changed, restore files/dnf/github_releases from cache.
      - name: Cache GitHub releases
        id: tag-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: files/dnf/github_releases
          key: tag-cache-${{ matrix.recipe }}-${{ hashFiles('.cache-github-releases.json') }}

      # Download direct-download RPMs only if cache is not hit
      - name: Download direct downloads
        if: steps.rpm-cache.outputs.cache-hit != 'true'
        run: |
          uv run ublue-images direct-downloads download

      # Download GitHub release RPMs only if cache is not hit
      - name: Download GitHub releases
        if: steps.tag-cache.outputs.cache-hit != 'true'
        run: |
          uv run ublue-images github-releases download

      - name: Install Podman
        uses: redhat-actions/podman-install@aea6ff44f2a4a82da13d22061ce73443a125925d
        with:
          ubuntu-version: 24.04

      # Build the image
      - name: Build Custom Image
        uses: blue-build/github-action@836161eb076426a451e6a0054f722b1153b8b3ad # v1.12.0
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          skip_checkout: true
          maximize_build_space: false
          use_cache: false
          chunkah: true

  # Delete old packages.
  delete-package-versions:
    name: Delete old packages
    needs: bluebuild
    runs-on: ubicloud-standard-2-ubuntu-2404
    steps:
      # Delete all packages older than 1 day
      - uses: snok/container-retention-policy@d3bdcf5ce9b05f685154e4a16c39233b245e3d53 # v3.1.0
        with:
          account: user
          token: ${{ secrets.PAT }}
          image-names: "*"
          cut-off: 1d
          dry-run: false
