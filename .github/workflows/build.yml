name: bluebuild
on:
  schedule:
    - cron: "30 6 * * *" # 06:30 UTC
  workflow_dispatch: # allow manually triggering builds
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  bluebuild:
    name: Build Custom Image
    runs-on: ubicloud-standard-4
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false # stop GH from cancelling all matrix builds if one fails
      matrix:
        recipe:
          - kinoite-nvidia.yml
          - kinoite.yml
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Get RPM cache info
        id: rpm-cache-info
        run: uv run scripts/download_rpms.py cache-info

      - name: Cache RPMs
        id: cache-rpms
        uses: actions/cache@v5
        with:
          path: ${{ steps.rpm-cache-info.outputs.paths }}
          key: ${{ steps.rpm-cache-info.outputs.key }}

      - name: Download RPMs
        run: uv run scripts/download_rpms.py download

      - name: Build Custom Image
        uses: blue-build/github-action@v1
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          skip_checkout: true
          maximize_build_space: false
          use_cache: true
