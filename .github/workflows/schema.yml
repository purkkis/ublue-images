name: Regenerate JSON Schema

on:
  push:
    branches:
      - main
    paths:
      - "src/ublue_images/downloader.py"

env:
  UV_LINK_MODE: "copy"
  UV_LOCKED: true

jobs:
  regenerate-schema:
    runs-on: ubicloud-standard-2-ubuntu-2404
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Regenerate schema.json
        run: uv run ublue-images schema

      - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "chore: regenerate releases_schema.json"
          file_pattern: "releases_schema.json"
