name: Regenerate JSON Schema

on:
  push:
    branches:
      - main
    paths:
      - "src/ublue_images/downloader.py"

env:
  UV_LINK_MODE: "copy"
  UV_LOCKED: true

jobs:
  regenerate-schema:
    runs-on: ubicloud-standard-2-ubuntu-2404 # avrea-ubuntu-24.04-1-vcpu
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true

      - name: Regenerate schema.json
        run: uv run ublue-images schema

      - uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "chore: regenerate releases_schema.json"
          file_pattern: "releases_schema.json"
