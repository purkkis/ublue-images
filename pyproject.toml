[project]
name = "ublue-images"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<4.0"
authors = [{ name = "Joona Purkamo", email = "joona@purkamo.me" }]
dependencies = [
  "pydantic>=2.12.5",
  "requests>=2.32.5",
]

[project.scripts]
ublue-images = "ublue_images:main"

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[tool.ruff]
indent-width = 4
line-length = 120

[tool.ruff.lint]
fixable = ["ALL"]
