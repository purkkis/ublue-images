# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
exclude: uv.lock|releases.json|releases_schema.json
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: mixed-line-ending
        args: [--fix=lf]
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 65dbdb59d2f2d9c3bdc343c566821ad3319ddaa3 # frozen: v0.16.3
    hooks:
      - id: ruff-check
        args: [--select, I, --fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e # frozen: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: e0bc482078af7eee1555b1f01d27e618d2212720 # frozen: v0.0.73
    hooks:
      - id: ty
